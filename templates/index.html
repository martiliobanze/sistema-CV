<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização do Currículo em Tempo Real</title>
    <style>
        body { font-family: Arial, sans-serif; background: #cbd5e0; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .folha-a4 { width: 210mm; min-height: 297mm; background: white; padding: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 4px; box-sizing: border-box; }
        h1 { margin: 0; text-transform: uppercase; font-size: 28px; }
        h3 { margin: 5px 0 0 0; color: #718096; font-size: 16px; font-weight: normal; }
        .contactos { margin-top: 10px; font-size: 13px; color: #4a5568; }
        .seccao-titulo { font-size: 14px; font-weight: bold; margin-top: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 3px; letter-spacing: 1px; }
        .texto-conteudo { font-size: 13px; color: #2d3748; line-height: 1.6; white-space: pre-line; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="folha-a4">
        <h1 id="vNome">Introduza o seu Nome</h1>
        <h3 id="vTitulo">Seu Cargo Profissional</h3>
        <div class="contactos">
            <b>Email:</b> <span id="vEmail">-</span> | <b>Telefone:</b> <span id="vTel">-</span>
        </div>
        
        <div class="seccao-titulo" id="s1">PERFIL PROFISSIONAL</div>
        <div class="texto-conteudo" id="vPerfil">-</div>
        
        <div class="seccao-titulo" id="s2">EXPERIÊNCIA PROFISSIONAL</div>
        <div class="texto-conteudo" id="vExp">-</div>
        
        <div class="seccao-titulo" id="s3">EDUCAÇÃO E FORMAÇÃO</div>
        <div class="texto-conteudo" id="vEdu">-</div>
    </div>

<script>
    // Criar o canal de escuta partilhado com a página do formulário
    const canal = new BroadcastChannel('cv_canal');

    // Escutar as alterações enviadas pelo formulário
    canal.onmessage = (evento) => {
        const dados = evento.data;
        
        document.getElementById('vNome').innerText = dados.nome || 'Introduza o seu Nome';
        document.getElementById('vNome').style.color = dados.cor;
        document.getElementById('vTitulo').innerText = dados.titulo || 'Seu Cargo Profissional';
        document.getElementById('vEmail').innerText = dados.email || '-';
        document.getElementById('vTel').innerText = dados.telefone_contacto || '-';
        document.getElementById('vPerfil').innerText = dados.perfil || '-';
        document.getElementById('vExp').innerText = dados.experiencia || '-';
        document.getElementById('vEdu').innerText = dados.educacao || '-';
        
        // Actualizar a cor das linhas divisórias
        ['s1', 's2', 's3'].forEach(id => {
            document.getElementById(id).style.color = dados.cor;
            document.getElementById(id).style.borderBottomColor = dados.cor;
        });
    };
</script>

</body>
</html>
